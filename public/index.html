<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>HolyApp · Trivia Bíblica</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; color: #1a1a1a;
      background: linear-gradient(160deg, #6A4FB6, #4a3580);
    }
    .card {
      background: rgba(255,255,255,.95); border-radius: 20px;
      padding: 40px 32px; max-width: 440px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    @media (prefers-color-scheme: dark) {
      .card { background: rgba(30,30,30,.95); color: #e6e6e6; }
    }
    h1 { color: #6A4FB6; margin: .2rem 0; }
    p { line-height: 1.6; }
    .links { margin-top: 24px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .links a {
      color: #6A4FB6; text-decoration: none; font-weight: 600;
      border: 2px solid #6A4FB6; border-radius: 10px; padding: 10px 16px;
    }
    .emoji { font-size: 3rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📖✝️</div>
    <h1>HolyApp</h1>
    <p>Trivia bíblica y teológica con método de fallo y corrección.
       7 niveles, de Entrada a Evangelista.</p>
    <div class="links">
      <a href="/privacidad">Política de Privacidad</a>
      <a href="/terminos">Términos de Uso</a>
      <a href="https://github.com/operonte/Holyapp/releases" target="_blank" rel="noopener">Descargar</a>
    </div>
  </div>
</body>
</html>
